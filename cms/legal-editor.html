<!DOCTYPE html>

      <a href="products.html" class="cms-nav__item cms-nav__item--sub">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="9" cy="21" r="1.4" fill="currentColor"/><circle cx="20" cy="21" r="1.4" fill="currentColor"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="cms-nav__label">รายการสินค้า</span>
      </a>
      <a href="product-categories.html" class="cms-nav__item cms-nav__item--sub">
        <span class="cms-nav__icon" aria-hidden="true">

        </span>
        <span class="cms-nav__label">หมวดหมู่สินค้า</span>
      </a>
      <div class="cms-nav__group-label">Newsroom</div>
      <a href="news-articles.html" class="cms-nav__item cms-nav__item--sub">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 8h10M7 12h10M7 16h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="cms-nav__label">รายการบทความ</span>
      </a>
      <a href="news-categories.html" class="cms-nav__item cms-nav__item--sub">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
        </span>
        <span class="cms-nav__label">หมวดหมู่</span>
      </a>

      <a href="pages.html" class="cms-nav__item cms-nav__item--sub">
        <span class="cms-nav__icon" aria-hidden="true">

        </span>
        <span class="cms-nav__label">รายการเพจ</span>
      </a>
      <div class="cms-nav__group-label">Footer</div>
      <a href="legal-editor.html?key=privacy-policy" class="cms-nav__item cms-nav__item--sub" data-legal-key="privacy-policy">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 2v5h5M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="cms-nav__label">นโยบายความเป็นส่วนตัว</span>
      </a>
      <a href="legal-editor.html?key=terms-of-use" class="cms-nav__item cms-nav__item--sub" data-legal-key="terms-of-use">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 2v5h5M9 13h6M9 17h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>

      <a href="social-links.html" class="cms-nav__item cms-nav__item--sub">

          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="6" cy="12" r="2.4" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="6" r="2.4" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="18" r="2.4" stroke="currentColor" stroke-width="1.6"/><path d="m8.1 10.9 6.8-3.6M8.1 13.1l6.8 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="cms-nav__label">Social</span>
      </a>
      <div class="cms-nav__group-label">ระบบ</div>
      <a href="admins.html" class="cms-nav__item cms-nav__item--sub">
        <span class="cms-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/><path d="M4 20c0-3.9 3.6-7 8-7s8 3.1 8 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>

  <div class="cms-main">
    <header class="cms-topbar">
      <div class="cms-topbar__right">
        <div class="cms-avatar-menu">
          <button type="button" class="cms-avatar" id="cmsAvatarBtn" aria-haspopup="true" aria-expanded="false">
            <span class="cms-avatar__circle" id="cmsUserInitial">?</span>
            <span class="cms-avatar__email" id="cmsUserEmail">...</span>
          </button>
          <div class="cms-avatar-menu__dropdown" id="cmsAvatarDropdown">
            <button type="button" class="cms-avatar-menu__item" id="cmsLogoutBtn">
              <span class="cms-nav__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              ออกจากระบบ
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="cms-content">
      <p class="cms-breadcrumb">CMS / Footer / <strong id="legalPageBreadcrumb">–</strong></p>

      <div class="cms-panel">
        <div class="cms-toolbar">
          <span class="cms-toolbar__label" id="legalPageTitle">–</span>
          <div class="cms-toolbar__right">
            <button type="button" class="cms-btn" id="historyBtn">🕘 ดูประวัติเวอร์ชัน (<span id="versionCount">0</span>)</button>
          </div>
        </div>

        <div class="cms-field">
          <label>เนื้อหา (TH)</label>
          <div class="cms-rich-editor" id="editorTh"></div>
        </div>
        <div class="cms-field">
          <label>เนื้อหา (EN)</label>
          <div class="cms-rich-editor" id="editorEn"></div>
        </div>
      </div>
    </main>

    <div class="cms-sticky-bottombar">
      <span class="cms-section-hint" id="legalPageMetaBottom" style="margin: 0;">–</span>
      <button type="button" class="cms-btn cms-btn--primary" id="saveBtn">บันทึก</button>
    </div>
  </div>
</div>

<!-- Modal ประวัติเวอร์ชัน (read-only) -->
<div class="cms-modal-overlay" id="legalHistoryModalOverlay" hidden>
  <div class="cms-modal cms-modal--wide">
    <div class="cms-modal__header">
      <h2 id="legalHistoryModalTitle">ประวัติเวอร์ชัน</h2>
      <button type="button" class="cms-modal__close" id="legalHistoryModalClose" aria-label="ปิด">✕</button>
    </div>
    <div class="cms-modal__body" id="legalHistoryModalBody">
      <!-- rendered by legal-editor.js -->
    </div>
  </div>
</div>

<div class="cms-toast" id="cmsToastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script src="upload.js"></script>
<script src="legal-editor.js"></script>
